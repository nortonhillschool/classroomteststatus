  <!-- Timer -->
  <div class="top-bar">
    <div id="timerBox">
      <svg id="timerCanvas" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" stroke="#ddd" stroke-width="6" fill="none"/>
        <circle id="arc" cx="50" cy="50" r="45"/>
      </svg>

      <div class="timer-content">
        <div id="timerDisplay">00:00</div>

        <div id="timerControls">
          <button id="btnStart">▶</button>
          <button id="btnPause">⏸</button>
          <button id="btnStop">⏹</button>
        </div>
      </div>

      <div id="timerInputGroup">
        <label>
          <input id="timerMinutes" type="number" min="0" max="59" value="2" class="timer-input">
          <span>min</span>
          <input id="timerSeconds" type="number" min="0" max="59" value="0" class="timer-input">
          <span>sec</span>
        </label>
      </div>
    </div>

    <!-- Title -->
    <div id="headerTitle">Please select a class.</div>
  </div>

  <!-- Teacher Dropdown -->
  <div class="control-bar" id="teacherDropdownContainer">
    <label for="teacherDropdown">Select Teacher:</label>
    <select id="teacherDropdown"></select>
  </div>

  <!-- Class Dropdown -->
  <div class="control-bar" id="dropdownContainer">
    <label for="classDropdown">Select Class:</label>
    <select id="classDropdown"></select>
  </div>

  <div id="status" class="status"></div>

  <div class="control-bar assignment-selectors" id="assignmentSelectors" style="display:none;">
    <label for="spellingAssignmentDropdown">Spelling test:</label>
    <select id="spellingAssignmentDropdown"></select>
    <label for="classroomAssignmentDropdown">Classroom test:</label>
    <select id="classroomAssignmentDropdown"></select>
  </div>

  <!-- Columns -->
  <div class="list-area">
    <div class="table-container" id="col1"></div>
    <div class="table-container" id="col2"></div>
    <div class="table-container" id="col3"></div>
    <div class="table-container" id="col4"></div>
  </div>

  <div id="completion-count" class="completion-count"></div>

<script>
  // === TIMER SETUP ===
  let timerSeconds = 0;
  let timerTotal   = 0;
  let timerInterval = null;
  let soundTimeouts = [];

  const disp = document.getElementById('timerDisplay');
  const arc  = document.getElementById('arc');
  const len  = 2 * Math.PI * 45;
  arc.setAttribute('stroke-dasharray', len);
  arc.setAttribute('stroke', '#333');
  arc.setAttribute('stroke-width', '6');
  arc.setAttribute('fill', 'none');

  function updateDisplay() {
    const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
    const s = String(timerSeconds % 60).padStart(2, '0');
    disp.textContent = `${m}:${s}`;
    const frac = timerSeconds / timerTotal || 0;
    arc.style.strokeDashoffset = len * (1 - frac);

    if (timerTotal > 0) {
      if (timerSeconds <= 30) {
        disp.style.color = 'red';
        arc.setAttribute('stroke', 'red');
      } else {
        disp.style.color = '#333';
        arc.setAttribute('stroke', '#333');
      }
      disp.classList.toggle('pulsing', timerSeconds <= 10);
    } else {
      disp.style.color = '#333';
      arc.setAttribute('stroke', '#333');
      disp.classList.remove('pulsing');
    }
  }

  function startTimer() {
    if (timerInterval) return;
    const mins = parseInt(document.getElementById('timerMinutes').value, 10) || 0;
    const secs = parseInt(document.getElementById('timerSeconds').value, 10) || 0;

    timerTotal = mins * 60 + secs;
    if (!timerTotal) return;

    timerSeconds = timerTotal;
    updateDisplay();
    document.getElementById('timerInputGroup').style.display = 'none';

    timerInterval = setInterval(() => {
      timerSeconds--;
      updateDisplay();

      if (timerSeconds <= 0) {
        stopTimer();
        const sound = document.getElementById('cowbellSound');

        for (let i = 0; i < 3; i++) {
          const timeoutId = setTimeout(() => {
            sound.currentTime = 0;
            sound.play();
          }, i * 1000);
          soundTimeouts.push(timeoutId);
        }

        const secondSequence = setTimeout(() => {
          for (let i = 0; i < 3; i++) {
            const id = setTimeout(() => {
              sound.currentTime = 0;
              sound.play();
            }, i * 1000);
            soundTimeouts.push(id);
          }
        }, 4500);
        soundTimeouts.push(secondSequence);
      }
    }, 1000);
  }

  function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    timerSeconds = 0;
    updateDisplay();
    document.getElementById('timerInputGroup').style.display = 'flex';

    soundTimeouts.forEach(id => clearTimeout(id));
    soundTimeouts = [];

    const sound = document.getElementById('cowbellSound');
    sound.pause();
    sound.currentTime = 0;
    disp.classList.remove('pulsing');
  }

  document.getElementById('btnStart').onclick = startTimer;
  document.getElementById('btnPause').onclick = pauseTimer;
  document.getElementById('btnStop').onclick = stopTimer;

  updateDisplay();

  // === CLASS / TEACHER / ASSIGNMENT LOGIC ===
  const classNameFromUrl = '<?= className ?>'.trim();
  const teacherFromUrl   = '<?= teacher ?>'.trim();

  let roster = [];
  let assignmentOptions = [];
  let selectedClassroomId = null;
  let selectedSpellingId = '';
  let selectedClassroomTestId = '';
  let studentStatuses = [];
  let refreshIntervalId = null;
  let hiddenManually = new Set();

  const completionCountEl = document.getElementById('completion-count');

  document.addEventListener('DOMContentLoaded', () => {
    if (teacherFromUrl && classNameFromUrl) {
      document.getElementById('teacherDropdownContainer').style.display = 'none';
      document.getElementById('dropdownContainer').style.display = 'none';
      loadTeacherAndClass(teacherFromUrl, classNameFromUrl);
    } else if (teacherFromUrl) {
      document.getElementById('teacherDropdownContainer').style.display = 'none';
      loadClassOptions(teacherFromUrl);
      document.getElementById('classDropdown').addEventListener('change', () => {
        const selected = getSelectedClassOption_();
        if (selected) loadTeacherAndClassFromSelection_(selected, teacherFromUrl);
      });
    } else {
      populateTeacherDropdown();
      document.getElementById('teacherDropdown').addEventListener('change', () => {
        const teacher = document.getElementById('teacherDropdown').value;
        loadClassOptions(teacher);
      });
      document.getElementById('classDropdown').addEventListener('change', () => {
        const teacher = document.getElementById('teacherDropdown').value;
        const selected = getSelectedClassOption_();
        if (teacher && selected) loadTeacherAndClassFromSelection_(selected, teacher);
      });
    }

    document.getElementById('spellingAssignmentDropdown').addEventListener('change', event => {
      selectedSpellingId = event.target.value;
      refreshStudentStatuses();
    });

    document.getElementById('classroomAssignmentDropdown').addEventListener('change', event => {
      selectedClassroomTestId = event.target.value;
      refreshStudentStatuses();
    });
  });

  function populateTeacherDropdown() {
    google.script.run
      .withSuccessHandler(data => {
        const dropdown = document.getElementById('teacherDropdown');
        dropdown.innerHTML = '';
        const defaultOption = new Option('Select teacher', '', true, true);
        defaultOption.disabled = true;
        dropdown.add(defaultOption);
        data.forEach(name => dropdown.add(new Option(name, name)));
      })
      .withFailureHandler(err => {
        document.getElementById('status').textContent = `Error loading teachers: ${err.message}`;
      })
      .getTeacherSheetNames();
  }

  function loadClassOptions(teacher) {
    document.getElementById('status').textContent = 'Loading classes...';
    google.script.run
      .withSuccessHandler(classes => {
        const classList = classes || [];
        const dropdown = document.getElementById('classDropdown');
        dropdown.innerHTML = '';
        const defaultOption = new Option('Select class', '', true, true);
        defaultOption.disabled = true;
        dropdown.add(defaultOption);

        classList.forEach(cls => {
          const option = new Option(cls.shortName, cls.classroomId || '');
          option.dataset.fullName = cls.fullName || '';
          option.dataset.shortName = cls.shortName || '';
          option.dataset.classroomId = cls.classroomId || '';
          dropdown.add(option);
        });

        document.getElementById('status').textContent = '';
      })
      .withFailureHandler(err => {
        document.getElementById('status').textContent = `Error loading classes: ${err.message}`;
      })
      .getClassesForTeacher(teacher);
  }

  function getSelectedClassOption_() {
    const dropdown = document.getElementById('classDropdown');
    if (!dropdown || dropdown.selectedIndex < 0) return null;

    const option = dropdown.options[dropdown.selectedIndex];
    if (!option || !option.value) return null;

    return {
      classroomId: option.dataset.classroomId || option.value,
      fullName: option.dataset.fullName || '',
      shortName: option.dataset.shortName || option.text || ''
    };
  }

  function loadTeacherAndClassFromSelection_(selection, teacherInitials = '') {
    document.getElementById('status').textContent = `Loading data for ${selection.shortName} (${selection.classroomId})...`;
    if (refreshIntervalId) clearInterval(refreshIntervalId);

    document.getElementById('teacherDropdownContainer').style.display = 'none';
    document.getElementById('dropdownContainer').style.display = 'none';

    selectedClassroomId = (selection.classroomId || '').trim();
    hiddenManually.clear();
    resetAssignments();

    if (!selectedClassroomId) {
      document.getElementById('status').textContent = `No classroom ID available for ${selection.shortName}`;
      return;
    }

    google.script.run.logSelectedClassRow(teacherInitials, {
      shortName: selection.shortName,
      fullName: selection.fullName,
      classroomId: selectedClassroomId
    });

    google.script.run
      .withSuccessHandler(data => {
        roster = data;
        loadAssignments(selectedClassroomId);
      })
      .withFailureHandler(err => {
        document.getElementById('status').textContent = `Roster error: ${err.message}`;
      })
      .getClassRoster(selection.fullName);
  }

  function loadTeacherAndClass(teacher, shortName) {
    document.getElementById('status').textContent = 'Loading data...';

    google.script.run
      .withSuccessHandler(classes => {
        const target = shortName.toLowerCase().trim();
        const normalize = value => value.toLowerCase().replace(/[^a-z0-9]/g, '');

        const match = classes.find(c => c.shortName.toLowerCase() === target)
          || classes.find(c => c.fullName.toLowerCase() === target)
          || classes.find(c => normalize(c.shortName) === normalize(target))
          || classes.find(c => normalize(c.fullName) === normalize(target));

        if (!match) {
          document.getElementById('status').textContent = `Class "${shortName}" not found in "${teacher}"`;
          return;
        }

        loadTeacherAndClassFromSelection_(match, teacher);
      })
      .withFailureHandler(err => {
        document.getElementById('status').textContent = `Error loading classes: ${err.message}`;
      })
      .getClassesForTeacher(teacher);
  }

  function loadAssignments(classroomId) {
    google.script.run
      .withSuccessHandler(assignments => {
        assignmentOptions = assignments || [];
        renderAssignmentDropdowns();
        document.getElementById('assignmentSelectors').style.display = 'flex';
        document.getElementById('headerTitle').textContent = 'Select Spelling test and Classroom test';
        document.getElementById('status').textContent = '';
      })
      .withFailureHandler(err => {
        document.getElementById('status').textContent = `Assignment error: ${err.message}`;
      })
      .getCourseAssignments(classroomId);
  }

  function renderAssignmentDropdowns() {
    const spelling = document.getElementById('spellingAssignmentDropdown');
    const classroom = document.getElementById('classroomAssignmentDropdown');

    spelling.innerHTML = '';
    classroom.innerHTML = '';

    spelling.add(new Option('Select assignment', '', true, true));
    classroom.add(new Option('Select assignment', '', true, true));

    assignmentOptions.forEach(a => {
      spelling.add(new Option(a.title, a.id));
      classroom.add(new Option(a.title, a.id));
    });

    selectedSpellingId = '';
    selectedClassroomTestId = '';
    studentStatuses = [];
    renderBalancedList();
  }

  function refreshStudentStatuses() {
    if (refreshIntervalId) clearInterval(refreshIntervalId);

    if (!selectedClassroomId || !selectedSpellingId || !selectedClassroomTestId) {
      studentStatuses = [];
      renderBalancedList();
      return;
    }

    document.getElementById('status').textContent = 'Loading student statuses...';
    google.script.run
      .withSuccessHandler(data => {
        studentStatuses = data;
        renderBalancedList();
        document.getElementById('status').textContent = '';
      })
      .withFailureHandler(err => {
        document.getElementById('status').textContent = `Status error: ${err.message}`;
      })
      .getStudentStatusesForAssignments(selectedClassroomId, roster, selectedSpellingId, selectedClassroomTestId);

    refreshIntervalId = setInterval(() => {
      google.script.run
        .withSuccessHandler(data => {
          studentStatuses = data;
          renderBalancedList();
        })
        .getStudentStatusesForAssignments(selectedClassroomId, roster, selectedSpellingId, selectedClassroomTestId);
    }, 10000);
  }

  function resetAssignments() {
    if (refreshIntervalId) clearInterval(refreshIntervalId);
    refreshIntervalId = null;
    document.getElementById('assignmentSelectors').style.display = 'none';
    studentStatuses = [];
    renderBalancedList();
  }

  function renderBalancedList() {
    const container = document.querySelector('.list-area');
    container.innerHTML = '';

    if (!selectedSpellingId || !selectedClassroomTestId) {
      completionCountEl.textContent = '';
      return;
    }

    const statusesByEmail = new Map(studentStatuses.map(s => [s.email, s]));
    const visible = roster
      .map(student => {
        const email = student.email?.toLowerCase().trim();
        return {
          fullName: student.fullName,
          email,
          spellingCompleted: statusesByEmail.get(email)?.spellingCompleted || false,
          classroomCompleted: statusesByEmail.get(email)?.classroomCompleted || false
        };
      })
      .filter(s => !hiddenManually.has(s.email))
      .sort((a, b) => a.fullName.localeCompare(b.fullName));

    const total = visible.length;
    const columnCount = total <= 27 ? 3 : 4;
    const chunkSize = Math.ceil(total / columnCount);
    const chunks = Array.from({ length: columnCount }, (_, i) =>
      visible.slice(i * chunkSize, (i + 1) * chunkSize)
    );

    chunks.forEach(chunk => {
      const col = document.createElement('div');
      col.className = 'table-container';
      const table = document.createElement('table');

      chunk.forEach(student => {
        const row = table.insertRow();
        const cell = row.insertCell();
        cell.className = 'name';

        const nameSpan = document.createElement('span');
        nameSpan.textContent = student.fullName;
        nameSpan.className = 'student-name';

        const pillsWrap = document.createElement('div');
        pillsWrap.className = 'pill-group';

        pillsWrap.appendChild(buildPill('S', student.spellingCompleted));
        pillsWrap.appendChild(buildPill('T', student.classroomCompleted));

        cell.appendChild(nameSpan);
        cell.appendChild(pillsWrap);

        cell.addEventListener('click', () => {
          hiddenManually.add(student.email);
          renderBalancedList();
        });
      });

      col.appendChild(table);
      container.appendChild(col);
    });

    const bothCompleted = visible.filter(s => s.spellingCompleted && s.classroomCompleted).length;
    completionCountEl.textContent = `${bothCompleted} of ${visible.length} completed both`;
  }

  function buildPill(label, completed) {
    const pill = document.createElement('span');
    pill.className = `status-pill ${completed ? 'complete' : 'incomplete'}`;
    pill.textContent = label;
    return pill;
  }

  document.getElementById('headerTitle').addEventListener('click', () => {
    hiddenManually.clear();
    renderBalancedList();
  });
</script>
